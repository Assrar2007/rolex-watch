<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-four-hour display diagram</title>
  <desc id="desc">An original schematic showing a fixed 24-hour scale and a separate orange hand.</desc>
