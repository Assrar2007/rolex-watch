  <rect width="800" height="800" rx="24" fill="#e8edeb"/>
  <circle cx="400" cy="400" r="306" fill="#263c45" filter="url(#shadow)"/>
  <circle cx="400" cy="400" r="270" fill="none" stroke="#d8e2df" stroke-width="34"/>
  <circle cx="400" cy="400" r="239" fill="url(#face)"/>
  <g fill="#304650" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="400" y="159">24</text><text x="518" y="191">02</text><text x="605" y="279">04</text><text x="640" y="410">06</text><text x="597" y="543">08</text><text x="507" y="629">10</text><text x="400" y="662">12</text><text x="291" y="629">14</text><text x="202" y="543">16</text><text x="160" y="410">18</text><text x="197" y="279">20</text><text x="283" y="191">22</text>
  </g>
  <g stroke="#66787d" stroke-width="3" opacity=".55"><circle cx="400" cy="400" r="205" fill="none" stroke-dasharray="2 32"/></g>
  <path d="M400 400 L400 198" stroke="#e45c27" stroke-width="13" stroke-linecap="round"/><path d="M400 177 l-18 31 36 0z" fill="#e45c27"/>
  <path d="M400 400 L520 316" stroke="#263c45" stroke-width="15" stroke-linecap="round"/><circle cx="400" cy="400" r="20" fill="#e45c27"/><circle cx="400" cy="400" r="8" fill="#f6f7f3"/>
  <text x="400" y="741" text-anchor="middle" fill="#304650" font-family="Arial,sans-serif" font-size="19" letter-spacing="3">FUNCTION SCHEMATIC · NOT PRODUCT PHOTOGRAPHY</text>
